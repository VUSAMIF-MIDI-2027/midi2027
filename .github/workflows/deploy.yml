name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview FTP changes without uploading
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: midi-production
  cancel-in-progress: false

defaults:
  run:
    working-directory: midi2027.WEB

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: midi2027.WEB/package-lock.json
      - run: npm ci
      - name: Check source code
        run: npm run lint -- src
      - name: Generate Next.js types
        run: npx next typegen
      - name: Check TypeScript
        run: npx tsc --noEmit --incremental false

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: midi2027.WEB/package-lock.json
      - run: npm ci
      - name: Build static website
        run: npm run build -- --webpack
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://midi.lt' }}
      - name: Upload website
        uses: actions/upload-artifact@v4
        with:
          name: midi-website
          path: midi2027.WEB/out/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: [lint, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download website
        uses: actions/download-artifact@v4
        with:
          name: midi-website
          path: website/
      - name: Validate deployment settings
        env:
          FTP_HOST: ${{ secrets.HOST }}
          FTP_USER: ${{ secrets.USER }}
          FTP_PASSWORD: ${{ secrets.PASSWORD }}
          FTP_TARGET: ${{ secrets.TARGET }}
        shell: bash
        working-directory: .
        run: |
          for setting in FTP_HOST FTP_USER FTP_PASSWORD FTP_TARGET; do
            if [ -z "${!setting}" ]; then
              echo "::error::Missing deployment secret: $setting"
              exit 1
            fi
          done
          if [[ "$FTP_TARGET" != */ ]]; then
            echo "::error::TARGET must end with /"
            exit 1
          fi
          test -f website/index.html
      - name: Deploy website over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASSWORD }}
          server-dir: ${{ secrets.TARGET }}
          local-dir: website/
          protocol: ftps
          security: strict
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.htaccess
            **/web.config
            api/**
            20[0-9][0-9]/**
            pagrindinis/**
